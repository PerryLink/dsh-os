name: Feature request
description: Propose a capability, a seam change, or a docs/demo improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the **problem**, not only the
        solution — it helps us compare alternatives and decide what belongs in a
        package versus in DSH itself.

        **This is an independent community project, not affiliated with DeepSeek.**
        A request here is not a request to DeepSeek, and it does not imply that
        DeepSeek endorses the project or will implement anything.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions and did not find the same request.
          required: true
        - label: I understand this is an independent community project and is not affiliated with DeepSeek.
          required: true
        - label: I am not asking DeepSeek to endorse, certify or officially support this project.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which package or cross-cutting area does this touch?
      multiple: false
      options:
        - dsh-act
        - dsh-allow
        - dsh-snip
        - dsh-nest
        - dsh-trigger
        - dsh-seek
        - dsh-stage
        - dsh-ring
        - "dsh-canary"
        - "dsh-runtime-env"
        - "dsh-record"
        - "dsh-os-cli"
        - "dsh-os-shell"
        - Contract / manifest / conformance
        - Docs / demo / examples
        - New package
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today? Who is affected, and how often?
      placeholder: "When I ..., I cannot ..., so I have to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A rough API, command or workflow is enough.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other packages, host features, scripts, or "do nothing" — and why they are not enough.
    validations:
      required: false

  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: The version you use today (`dsh --version`). Helps us judge compatibility.
      placeholder: "0.2.2-rc.4"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Current install method
      description: How do you install dsh-os packages today?
      multiple: false
      options:
        - dsh plugin --profile web add <package>
        - dsh plugin add github:<owner>/<repo>
        - Release tarball (.tgz)
        - Local checkout / link / workspace
        - Not installed yet
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or examples
      description: Optional. Command output, config snippets, links to related discussions. Redact secrets.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: willingness
    attributes:
      label: Would you be willing to contribute?
      multiple: false
      options:
        - Yes, I can open a PR
        - Yes, I can test a proposed change
        - No, I am only reporting the need
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, related upstream issues, constraints we should know about.
    validations:
      required: false
